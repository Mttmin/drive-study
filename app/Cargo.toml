[package]
name = "drive-study-app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "drive-study"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1"
drive-study-core = { path = "../core" }
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8.23", default-features = false, features = ["csr"] }
rexie = "0.6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "FileList",
  "File",
  "HtmlAudioElement",
  "Event",
  "EventTarget",
  "Navigator",
  "Location",
  "SpeechSynthesis",
  "SpeechSynthesisUtterance",
  "SpeechSynthesisVoice",
  "MediaSession",
  "MediaMetadata",
  "MediaSessionAction",
  "WakeLock",
  "WakeLockSentinel",
  "WakeLockType",
  "Cache",
  "CacheStorage",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "Blob",
  "Url",
  "console",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",
  "StorageManager",
  "Storage",
] }
